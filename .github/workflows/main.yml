name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        haxe-version: [latest, 4.3.7]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe-version }}
      - name: Print Haxe version
        run: |
          haxe --version
      - name: Install haxelib deps
        run: |
          haxelib dev heaps .
          haxelib git format https://github.com/HaxeFoundation/format
          haxelib git hxbit https://github.com/ncannasse/hxbit
          haxelib git hscript https://github.com/HaxeFoundation/hscript
          haxelib git domkit https://github.com/HeapsIO/domkit
          haxelib git hide https://github.com/HeapsIO/hide
          haxelib git hlsdl https://github.com/NMB-Team/hashlink-nmb master libs/sdl
          haxelib git castle https://github.com/ncannasse/castle
          haxelib git hldx https://github.com/NMB-Team/hashlink-nmb master libs/directx
          haxelib git hlopenal https://github.com/NMB-Team/hashlink-nmb master libs/openal
      - name: Build all.hxml
        run: |
          haxe all.hxml
      - name: Build samples
        run: |
          cd samples
          haxe all.hxml
          cd ..
      - name: Build graphics backend smoke matrix
        run: |
          for backend in dx11 dx12 vulkan opengl angle; do
            haxe \
              -cp samples \
              -lib heaps \
              -lib hlsdl \
              -main AngleSmoke \
              -hl "angle-smoke-$backend.hl" \
              -D "gfx_$backend" \
              -D "default_gfx_$backend" \
              -D hl-ver=1.16.0
          done
