name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        haxe-version: [latest, 4.3.7]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe-version }}
      - name: Print Haxe version
        run: |
          haxe --version
      - name: Install haxelib deps
        run: |
          haxelib dev heaps .
          haxelib git format https://github.com/HaxeFoundation/format
          haxelib git hxbit https://github.com/ncannasse/hxbit
          haxelib git hscript https://github.com/HaxeFoundation/hscript
          haxelib git domkit https://github.com/HeapsIO/domkit
          haxelib git hide https://github.com/HeapsIO/hide
          haxelib git hlsdl https://github.com/NMB-Team/hashlink-nmb master libs/sdl
          haxelib git castle https://github.com/ncannasse/castle
          haxelib git hldx https://github.com/NMB-Team/hashlink-nmb master libs/directx
          haxelib git hlopenal https://github.com/NMB-Team/hashlink-nmb master libs/openal
      - name: Build all.hxml
        run: |
          haxe all.hxml
      - name: Build samples
        run: |
          cd samples
          haxe all.hxml
          cd ..
  graphics-backends:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: dx11
            flags: -lib hlsdl -D gfx_dx11
          - backend: dx12
            flags: -lib hlsdl -D gfx_dx12
          - backend: vulkan
            flags: -lib hlsdl -D gfx_vulkan
          - backend: opengl
            flags: -lib hlsdl -D gfx_opengl
          - backend: multidriver
            flags: -lib hlsdl -D gfx_dx11 -D gfx_dx12 -D gfx_vulkan -D gfx_opengl
    runs-on: ubuntu-latest
    name: Graphics backend (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v7
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: latest
      - name: Install haxelib deps
        run: |
          haxelib dev heaps .
          haxelib git format https://github.com/HaxeFoundation/format
          haxelib git hlsdl https://github.com/NMB-Team/hashlink-nmb master libs/sdl
      - name: Compile backend
        run: haxe tests/backend-smoke.hxml ${{ matrix.flags }}
